name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/marketplace_versions.py
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - name: Exercise the phone setup form in Chromium and WebKit
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
          python scripts/check_mobile.py
      - run: python scripts/package.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '24'
      - name: Test and pack the n8n community node
        if: matrix.os == 'ubuntu-latest'
        working-directory: n8n
        run: |
          python scripts/export_catalog.py
          git diff --exit-code -- nodes/MaRu/catalog.json
          npm ci --ignore-scripts
          npm test
          python -m pip install trustme
          python ../scripts/check_n8n_gateway.py
          npm pack --pack-destination ../dist
      - name: Build and run the self-contained Windows plugin
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install uv
          uv build --wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv python install cpython-3.13-windows-x86_64-none --install-dir .cache/runtime --no-bin --no-registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtimePath = (Get-ChildItem .cache/runtime -Directory -Filter 'cpython-3.13.*-windows-x86_64-none').FullName
          python scripts/package.py --windows-runtime $runtimePath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_windows_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'windows-latest'
        with:
          name: ma-ru-windows-x64
          path: dist/*-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: ma-ru-plugin
          path: |
            dist/*.zip
            dist/*.tgz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Match tag to plugin version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version plugins/ma-ru/plugin.json)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          sha256sum *.zip *.tgz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes *.tgz *.zip SHA256SUMS.txt

  clawhub:
    name: Publish ClawHub ${{ matrix.channel }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        channel: [skill, package]
    concurrency:
      group: ma-ru-clawhub-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download the verified release archive
        if: matrix.channel == 'package'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" -D dist -p "ma-ru-${GITHUB_REF_NAME#v}-clawhub.tgz" -p SHA256SUMS.txt
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS.txt)
      - name: Install pinned publishing CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/ma-ru-cli" --ignore-scripts --no-audit --no-fund clawhub@0.27.0
          echo "$RUNNER_TEMP/ma-ru-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Preview release
        run: python3 scripts/clawhub_release.py "${{ matrix.channel }}" --dry-run
      - name: Publish and verify public files
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/ma-ru-clawhub.json
        run: |
          umask 077
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::Set the CLAWHUB_TOKEN Actions secret for grebennikovxyz, then re-run failed jobs on this tag."
            exit 1
          fi
          trap 'rm -f -- "$CLAWHUB_CONFIG_PATH"' EXIT
          python3 -c 'import json, os; from pathlib import Path; Path(os.environ["CLAWHUB_CONFIG_PATH"]).write_text(json.dumps({"registry":"https://clawhub.ai","token":os.environ["CLAWHUB_TOKEN"]}))'
          unset CLAWHUB_TOKEN
          python3 scripts/clawhub_release.py "${{ matrix.channel }}"

  directory-review:
    name: Track review-only directories
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare the release handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Marketplace review · Ma-Ru ${GITHUB_REF_NAME}"
          python3 scripts/directory_status.py > "$RUNNER_TEMP/ma-ru-directories.md"
          cat "$RUNNER_TEMP/ma-ru-directories.md" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state all --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number")
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/ma-ru-directories.md"
          fi
